[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opentopas-workbench"
dynamic = ["version"]
description = "Local web UI for OpenTOPAS and TOPAS: edit parameter files, run them in a queue, plot scorer output."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Robin Golle"}]
requires-python = ">=3.8"
keywords = ["OpenTOPAS", "TOPAS", "Geant4", "Monte Carlo", "particle therapy", "medical physics"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.urls]
Homepage = "https://github.com/Robing98/opentopas-workbench"

[project.scripts]
opentopas-workbench = "opentopas_workbench.server:main"

[tool.setuptools]
packages = ["opentopas_workbench"]

[tool.setuptools.dynamic]
version = {attr = "opentopas_workbench.__version__"}

[tool.setuptools.package-data]
opentopas_workbench = ["ui.html", "generators/*.py"]
