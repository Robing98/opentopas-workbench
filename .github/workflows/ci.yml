name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # oldest supported Python: ubuntu-latest (26.04) only offers 3.10 and later
          - os: ubuntu-24.04
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest numpy scipy h5py .
      # the public matRad machines (GPL, not kept in this repository) for the Machines view tests, at a fixed matRad commit
      - name: Public matRad machines
        run: |
          mkdir -p "$RUNNER_TEMP/matrad"
          for f in protons_Generic carbon_Generic; do
            curl -sfL -o "$RUNNER_TEMP/matrad/$f.mat" "https://raw.githubusercontent.com/e0404/matRad/008bfd7c2e8d5101912262a33adea5ef867d7f25/matRad/basedata/$f.mat"
          done
          echo "MATRAD_BASEDATA=$RUNNER_TEMP/matrad" >> "$GITHUB_ENV"
      - run: pytest -q
